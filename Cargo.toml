[workspace]
exclude = ["scripts/build-protos"]
members = [
  "crates/boon",
  "crates/boon-dev",
  "crates/boon-proto",
  "crates/boon-python",
]
resolver = "2"

[workspace.package]
version = "0.10.0"
rust-version = "1.88.0"

[workspace.dependencies]
boon = { path = "crates/boon", package = "boon-deadlock", version = "0.10.0" }
boon-proto = { path = "crates/boon-proto", version = "0.3" }
pbdems2 = "0.3"
anyhow = "1.0"
criterion = "0.5"
prost = "0.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
redundant_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.dev]
incremental = false   # boon-proto is a 28k-line generated crate; incremental bookkeeping
                      # (dep-graph + query-cache) ballooned target/ to tens of GB for little gain

[profile.dev.package.boon-deadlock]
opt-level = 1

[profile.dev.package.boon-proto]
debug = false         # never step into prost-generated proto code; skip its debuginfo

[profile.release]
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization, slower compile
