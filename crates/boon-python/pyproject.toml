[project]
name = "boon-deadlock"
description = "Boon is a Deadlock demo parser."
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Peter Xenopoulos", email = "pnxenopoulos+boon@gmail.com" },
]
dynamic = ["version"]
keywords = ["deadlock", "demo", "parser", "replay"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["polars>=1.0", "typer>=0.12"]

[project.scripts]
boon = "boon.cli:app"

[project.urls]
Homepage = "https://github.com/pnxenopoulos/boon"
Documentation = "https://boon.readthedocs.io"
Repository = "https://github.com/pnxenopoulos/boon"
Discord = "https://discord.gg/WmjZHxWrCD"
Issues = "https://github.com/pnxenopoulos/boon/issues"

[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
    "pytest>=8.0",
]
quality = ["ruff==0.16.9", "ty==0.0.84"]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.0.0",
    "sphinx>=9.0.4",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "boon._boon"
python-source = "python"
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
