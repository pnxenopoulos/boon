[package]
name = "boon-dev"
version.workspace = true
rust-version.workspace = true
edition = "2024"
publish = false
description = "Low-level developer / debugging CLI for Deadlock demo files (in-repo only, not published)"
license = "MIT"
repository = "https://github.com/pnxenopoulos/boon"
documentation = "https://boon.readthedocs.io/"
authors = ["Peter Xenopoulos"]
keywords = ["deadlock", "demo", "parser", "replay", "source2"]
categories = ["command-line-utilities", "game-development"]

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
colored = "2"
serde.workspace = true
serde_json.workspace = true
boon.workspace = true
boon-proto.workspace = true
prost.workspace = true

[dev-dependencies]
criterion.workspace = true

[lib]
name = "boon_dev"
path = "src/lib.rs"

[[bin]]
name = "boon-dev"
path = "src/main.rs"

[[bench]]
name = "cli"
harness = false

[lints]
workspace = true
