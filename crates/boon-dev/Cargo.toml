[package]
name = "boon-dev"
version.workspace = true
rust-version.workspace = true
edition = "2024"
publish = false
description = "Low-level developer / debugging CLI for Deadlock demo files (in-repo only, not published)"
license = "MIT"
repository = "https://github.com/pnxenopoulos/boon"
documentation = "https://boon.readthedocs.io/"
authors = ["Peter Xenopoulos"]
keywords = ["deadlock", "demo", "parser", "replay", "source2"]
categories = ["command-line-utilities", "game-development"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
boon = { package = "boon-deadlock", path = "../boon" }
boon-proto = { path = "../boon-proto" }
prost = "0.14"

[dev-dependencies]
criterion = "0.5"

[lib]
name = "boon_dev"
path = "src/lib.rs"

[[bin]]
name = "boon-dev"
path = "src/main.rs"

[[bench]]
name = "cli"
harness = false
