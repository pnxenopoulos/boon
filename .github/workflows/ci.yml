name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (stable) + rustfmt, clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-${{ runner.os }}-stable

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features --exclude boon-dev --exclude boon-python

  lint-python:
    name: Python Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/boon-python
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install quality tools and runtime dependencies
        run: uv sync --locked --no-install-project --no-default-groups --group quality

      - name: Ruff
        run: uv run --no-sync ruff check python/boon

      - name: ty
        run: uv run --no-sync ty check python/boon

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  test-rust:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.rust }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test
        run: cargo nextest run --workspace --all-features --locked --exclude boon-python --failure-output immediate-final

  build-python-wheels:
    name: Build Python Wheels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build wheels for all Python versions
        uses: PyO3/maturin-action@v1
        with:
          args: --out dist -m crates/boon-python/Cargo.toml --interpreter 3.11 3.12 3.13 3.14

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: python-wheels
          path: dist/*.whl

  test-python:
    name: Python Tests (${{ matrix.python-version }})
    needs: build-python-wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Space-separated list of public URLs for demo fixture files.
      DEMO_URLS: "https://github.com/pnxenopoulos/boon-fixtures/releases/download/70555151/70555151.dem https://github.com/pnxenopoulos/boon-fixtures/releases/download/70537442/70537442.dem"
      # Large regression fixtures run on Python 3.13; their tests skip in other jobs.
      REGRESSION_DEMO_URLS: >-
        https://github.com/pnxenopoulos/boon-fixtures/releases/download/103129247/103129247.dem
        https://github.com/pnxenopoulos/boon-fixtures/releases/download/100655353/100655353.dem

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v7
        with:
          name: python-wheels
          path: dist

      - name: Download demo fixtures
        working-directory: crates/boon-python
        run: |
          mkdir -p tests/fixtures
          if [ -n "$DEMO_URLS" ]; then
            for url in $DEMO_URLS; do
              echo "Downloading $url ..."
              curl -fSL --retry 3 -o "tests/fixtures/$(basename "$url")" "$url"
            done
          else
            echo "No DEMO_URLS configured — skipping fixture download"
          fi
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            for url in $REGRESSION_DEMO_URLS; do
              echo "Downloading $url ..."
              curl -fSL --retry 3 -o "tests/fixtures/$(basename "$url")" "$url"
            done
          fi

      - name: Install wheel and test dependencies
        working-directory: crates/boon-python
        run: |
          uv sync --locked --no-install-project
          CPVER="cp$(echo ${{ matrix.python-version }} | tr -d .)"
          WHEEL=$(ls ../../dist/boon_deadlock-*-${CPVER}-*.whl)
          uv pip install "$WHEEL"

      - name: Run pytest
        working-directory: crates/boon-python
        run: uv run --no-sync pytest tests/ -v

      - name: Benchmark harness checks
        if: matrix.python-version == '3.13'
        working-directory: crates/boon-python
        run: |
          uv run --no-sync pytest benchmarks/test_benchmarks.py -q
          uv run --no-sync python benchmarks/bench_parse.py \
            --demo tests/fixtures/103129247.dem \
            --case construct --case snapshot/single --case load/combat \
            --repeat 1 --warmup 0 --build-profile debug \
            --output ../../target/benchmarks/ci-smoke.json

      - name: Upload benchmark smoke report
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-smoke
          path: target/benchmarks/ci-smoke.json
          if-no-files-found: warn

  dry-run-publish-parser:
    name: Dry Run (crates.io)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          key: dry-run-parser-${{ runner.os }}

      - name: cargo publish --dry-run (boon-proto)
        run: cargo publish --dry-run -p boon-proto

      - name: Check parser publish prerequisite
        id: proto
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "boon-proto") | .version')
          STATUS=$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/boon-proto/$VERSION")
          case "$STATUS" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Publish boon-proto $VERSION before releasing boon-deadlock. Parser packaging cannot resolve it yet."
              ;;
            *) echo "::error::Could not check boon-proto publication (HTTP $STATUS)"; exit 1 ;;
          esac

      - name: cargo publish --dry-run (boon-deadlock)
        if: steps.proto.outputs.published == 'true'
        run: cargo publish --dry-run --locked -p boon-deadlock

  dry-run-publish-python:
    name: Dry Run (PyPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -m crates/boon-python/Cargo.toml

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/boon-python/Cargo.toml

      - name: Verify dist contents
        run: ls -lh dist/

  docs:
    name: Sphinx Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sphinx dependencies
        run: pip install -r crates/boon-python/docs/requirements.txt

      - name: Build docs
        working-directory: crates/boon-python/docs
        run: sphinx-build -W -b html . _build/html

  check:
    name: CI Check
    if: always()
    needs: [lint, lint-python, deny, test-rust, build-python-wheels, test-python, docs, dry-run-publish-parser, dry-run-publish-python]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.lint-python.result }}" != "success" ||
                "${{ needs.deny.result }}" != "success" ||
                "${{ needs.test-rust.result }}" != "success" ||
                "${{ needs.build-python-wheels.result }}" != "success" ||
                "${{ needs.test-python.result }}" != "success" ||
                "${{ needs.docs.result }}" != "success" ||
                "${{ needs.dry-run-publish-parser.result }}" != "success" ||
                "${{ needs.dry-run-publish-python.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi

  coverage:
    name: Coverage
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (stable) + components (incl. llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage-${{ runner.os }}-stable

      - name: Install cargo-nextest & cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: |
            nextest
            cargo-llvm-cov

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Run coverage and print summary
        run: |
          cargo llvm-cov nextest --workspace --all-features --exclude boon-python
          echo "------ Coverage Summary ------"
          cargo llvm-cov report --summary-only
