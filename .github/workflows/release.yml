name: Release Boon

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to release"
        required: true
        type: choice
        options:
          - boon-proto
          - boon
          - boon-python
      version:
        description: "Expected package version (without a leading v)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci-gate:
    name: Verify release commit
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    outputs:
      package: ${{ steps.release.outputs.package }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_title: ${{ steps.release.outputs.release_title }}
      proto_version: ${{ steps.release.outputs.proto_version }}
      boon_version: ${{ steps.release.outputs.boon_version }}
    steps:
      - name: Require the main branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "Releases can only be dispatched from main (got $REF)"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          result=$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA/check-runs" --jq '.check_runs[] | select(.name == "CI Check") | .conclusion')
          if [ "$result" != success ]; then
            echo "CI Check has not passed on $COMMIT_SHA (result: ${result:-not found})"
            exit 1
          fi

      - name: Resolve and verify the package version
        id: release
        env:
          COMPONENT: ${{ inputs.component }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          proto_version=$(printf '%s' "$metadata" | jq -r '.packages[] | select(.name == "boon-proto") | .version')
          boon_version=$(printf '%s' "$metadata" | jq -r '.packages[] | select(.name == "boon-deadlock") | .version')
          python_version=$(printf '%s' "$metadata" | jq -r '.packages[] | select(.name == "boon-python") | .version')

          case "$COMPONENT" in
            boon-proto)
              package=boon-proto
              actual_version=$proto_version
              tag="boon-proto-v$actual_version"
              release_title="boon-proto $actual_version"
              ;;
            boon)
              package=boon-deadlock
              actual_version=$boon_version
              tag="boon-v$actual_version"
              release_title="Boon $actual_version"
              ;;
            boon-python)
              package=boon-python
              actual_version=$python_version
              tag="boon-python-v$actual_version"
              release_title="Boon Python $actual_version"
              ;;
            *)
              echo "Unknown component: $COMPONENT"
              exit 1
              ;;
          esac

          if [ -z "$actual_version" ] || [ "$actual_version" = null ]; then
            echo "Could not resolve the version of $package from Cargo metadata."
            exit 1
          fi
          if [ "$actual_version" != "$REQUESTED_VERSION" ]; then
            echo "Requested $package $REQUESTED_VERSION, but Cargo.toml contains $actual_version."
            exit 1
          fi

          echo "Releasing $package $actual_version from $GITHUB_SHA"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$actual_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"
          echo "proto_version=$proto_version" >> "$GITHUB_OUTPUT"
          echo "boon_version=$boon_version" >> "$GITHUB_OUTPUT"

      - name: Require the preceding package release
        env:
          COMPONENT: ${{ inputs.component }}
          PROTO_VERSION: ${{ steps.release.outputs.proto_version }}
          BOON_VERSION: ${{ steps.release.outputs.boon_version }}
        run: |
          case "$COMPONENT" in
            boon)
              required_package=boon-proto
              required_version=$PROTO_VERSION
              ;;
            boon-python)
              required_package=boon-deadlock
              required_version=$BOON_VERSION
              ;;
            boon-proto)
              exit 0
              ;;
          esac

          encoded_version=$(printf '%s' "$required_version" | jq -sRr @uri)
          url="https://crates.io/api/v1/crates/$required_package/$encoded_version"
          if ! curl -fsS -A "boon-release" -o /dev/null "$url"; then
            echo "$required_package $required_version is not published on crates.io."
            echo "Release $required_package first."
            exit 1
          fi

      - name: Require an available tag
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME" --jq .object.sha 2>&1); then
            if [ "$response" = "$COMMIT_SHA" ]; then
              echo "$TAG_NAME already points at $COMMIT_SHA; finalization will be a no-op."
            else
              echo "$TAG_NAME already exists on $response; bump the package version before releasing."
              exit 1
            fi
          elif printf '%s\n' "$response" | grep -q 'HTTP 404'; then
            echo "$TAG_NAME is available."
          else
            printf '%s\n' "$response" >&2
            echo "Could not determine whether $TAG_NAME already exists."
            exit 1
          fi

  build-linux:
    name: Build Linux wheels (${{ matrix.target }})
    needs: ci-gate
    if: inputs.component == 'boon-python'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m crates/boon-python/Cargo.toml --interpreter 3.11 3.12 3.13 3.14
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS wheels (${{ matrix.target }})
    needs: ci-gate
    if: inputs.component == 'boon-python'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m crates/boon-python/Cargo.toml --interpreter 3.11 3.12 3.13 3.14

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows wheels
    needs: ci-gate
    if: inputs.component == 'boon-python'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist -m crates/boon-python/Cargo.toml --interpreter 3.11 3.12 3.13 3.14

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x86_64
          path: dist
          if-no-files-found: error
          retention-days: 7

  build-sdist:
    name: Build source distribution
    needs: ci-gate
    if: inputs.component == 'boon-python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/boon-python/Cargo.toml

      - name: Upload source distribution
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish-rust:
    name: Publish ${{ inputs.component }} to crates.io
    needs: ci-gate
    if: inputs.component == 'boon-proto' || inputs.component == 'boon'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGE: ${{ needs.ci-gate.outputs.package }}
          VERSION: ${{ needs.ci-gate.outputs.version }}
        run: |
          encoded_version=$(printf '%s' "$VERSION" | jq -sRr @uri)
          url="https://crates.io/api/v1/crates/$PACKAGE/$encoded_version"
          if curl -fsS -A "boon-release" -o /dev/null "$url"; then
            echo "$PACKAGE $VERSION is already published; skipping."
          else
            cargo publish --locked -p "$PACKAGE" --registry crates-io
          fi

  publish-python:
    name: Publish boon-python to PyPI
    needs: [ci-gate, build-linux, build-macos, build-windows, build-sdist]
    if: inputs.component == 'boon-python'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  finalize:
    name: Tag and publish the GitHub release
    needs: [ci-gate, publish-rust, publish-python]
    if: >-
      ${{
        always() &&
        needs.ci-gate.result == 'success' &&
        (
          (inputs.component == 'boon-python' && needs.publish-python.result == 'success') ||
          (inputs.component != 'boon-python' && needs.publish-rust.result == 'success')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ needs.ci-gate.outputs.tag }}
        run: |
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME" --jq .object.sha 2>&1); then
            if [ "$response" = "$COMMIT_SHA" ]; then
              echo "$TAG_NAME already points at $COMMIT_SHA; nothing to do."
              exit 0
            fi
            echo "$TAG_NAME already exists on $response; refusing to move it."
            exit 1
          elif ! printf '%s\n' "$response" | grep -q 'HTTP 404'; then
            printf '%s\n' "$response" >&2
            echo "Could not determine whether $TAG_NAME already exists."
            exit 1
          fi

          gh api "repos/$REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG_NAME" \
            -f sha="$COMMIT_SHA" > /dev/null
          echo "Tagged $COMMIT_SHA as $TAG_NAME"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TITLE: ${{ needs.ci-gate.outputs.release_title }}
          TAG_NAME: ${{ needs.ci-gate.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub Release $TAG_NAME already exists; nothing to do."
            exit 0
          fi

          notes_file=".github/release-notes/$TAG_NAME.md"
          if [ -f "$notes_file" ]; then
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --notes-file "$notes_file" \
              --repo "$REPOSITORY"
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --repo "$REPOSITORY"
          fi
